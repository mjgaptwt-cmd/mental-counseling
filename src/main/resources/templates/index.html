<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>メンタルカウンセリング</title>
	
    <style>
        body {
            font-family: 'Helvetica Neue', Arial, 'ヒラギノ角ゴ Pro W3', sans-serif;
			font-weight:  500;
			color:  rgb(0, 0, 0);
            margin: 0;
            padding: 30px;        
            font-size: 17px;
	      	background: none;
			}
			
			/* 背景動画の設定 */
			.background-video {
			    position: fixed;
			    top: 0;
			    left: 0;
			    width: 100%;
			    height: 100%;
			    object-fit: cover;
			    z-index: 0;
			    pointer-events: none;
			}
			
        /* メインコンテナ・不透明白から半透明ガラス風に変更 */
        /* 数値を『0.82』を[0.65]などに下げると、さらに後ろの背景が透明になる */
        .container {
            background-color: #ffffff;  
            background-color: rgba(225, 225, 225, 0.40);  /* 透明調整 */
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3); 
            max-width: 1350px;
            margin: 0 auto;
            border: 1px solid #e8dfd5;
			position:  relative;
			z-index: 1;
        }
                
        /* タイトル 【メンタルカウンセリング】 のデザイン */
        h1 {
            color: rgb(0, 64, 64);
            text-shadow: 1px 1px 2px rgba(255, 255, 255, 0.);
            margin-bottom: 25px;
            text-align: center;
            font-size: 39px;
            letter-spacing: 1px;
        }
        
        /* 投稿フォームエリア（温かみのあるアースカラー） */
        form {
            margin-bottom: 35px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            background: rgba(128, 255, 255, 0.20);
            padding: 28px;
            border-radius: 14px;
            border: 2px solid rgb(0, 128, 128);
        }
		
        label {
            font-weight: 600;
            color: #2d6a4f;
            font-size: 17px;
        }
    
        /* テキスト入力欄・テキストエリア共通 */
        input[type="text"], textarea {
            padding: 14px;
            border-radius: 10px;
            border: 1px solid rgb(0, 64, 0);
            font-size: 18px;
            font-family: inherit;
            width: 100%;
            box-sizing: border-box;
        }

        textarea {
            resize: vertical;
            height: 90px;
        }
        
        button[type="submit"] {
            padding: 16px;
            background-color: rgb(0, 128, 64);
            color: rgb(255, 255, 255);
            border: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 19px;
            cursor: pointer;
            transition: background 0.2s;
        }

        button[type="submit"]:hover {
            background-color: rgb(128, 255, 128);
        }

        /* ローディング画面のデザイン */
        #loadingOverlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(60, 45, 35, 0.75);
            z-index: 9999;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            color: white;
            font-size: 20px;
            font-weight: bold;
        }
        
        /* ローディング中のぐるぐる回るスピナーアニメーション */
        .spinner {
            border: 6px solid rgba(255, 255, 255, 0.3);
            border-top: 6px solid rgb(0, 255, 255);
            border-radius: 50%;
            width: 60px;
            height: 60px;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
            
        /* テーブル全体のデザイン・幅調整 */
        table {
            width: 100%;
            border-collapse: collapse;
            background-color: rgba(225, 225, 225, 0.60);
            margin-top: 20px;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            border: 1px solid #e8dfd5;
        }
        
        th, td {
            padding: 20px 16px;
            border-bottom: 1px solid #ddd;  
            text-align: left;
            vertical-align: top;
            font-size: 17px;
			line-height:  1.8;
			font-weight: 500;
			color: #222222;
        }

        /* テーブルの列幅や文字寄せの設定（タイトル列削除に伴う調整） */
        th:nth-child(1), td:nth-child(1) { width: 5%; text-align: center; } /* ID */
        th:nth-child(2), td:nth-child(2) { width: 22%; } /* 本文 */
		/* がんばったことの列 */
		th:nth-child(3) {
		    width: 18%;
		    color: white;
		}

		td:nth-child(3) {
		    width: 18%;
		    color: #222222;
		    font-weight: 500;
		}
        th:nth-child(4), td:nth-child(4) { width: 16%; text-align: center; } /* 危険度・登録日時 */
        th:nth-child(5), td:nth-child(5) { width: 39%; } /* AI結果 */
        
        th {
            background-color: rgb(0, 128, 128);
            color: white;
            font-size: 18px;
			font-weight:  700;
        }
        
        /* 危険度のレベルによって文字色や背景を変えるスタイル */
        .badge-level1 { background-color: #e8f5e9; color: #2e7d32; border: 2px solid #a5d6a7; }
        .badge-level2 { background-color: #fffde7; color: #f57f17; border: 2px solid #fff59d; }
        .badge-level3 { background-color: #fff3e0; color: #e65100; border: 2px solid #ffb74d; }
        .badge-level4 { background-color: #ffebee; color: #c62828; border: 2px solid #ef9a9a; font-weight: bold; }
        .badge-level5 { background-color: #f3e5f5; color: #6a1b9a; border: 2px solid #ce93d8; font-weight: bold; }
        
        .danger-badge {
            display: inline-flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            padding: 12px 16px;
            border-radius: 16px;
            font-weight: bold;
            font-size: 18px;
            width: 85%;
            margin-bottom: 8px;
        }        
        
        .danger-icon {
            width: 48px;
            height: 48px;
            object-fit: contain;
        }
		
        .created-time {
            font-size: 20px;
            color: rgb(0, 0, 0);
            margin-top: 4px;
            display: block;
			font-weight: 250;
        }
        
        /* AI分析結果テキストの表示エリアの設定 */
        .ai-content {
            white-space: pre-line;
            line-height: 1.9;
            font-size: 20px;
            color: #222222;
			font-weight: 500;
            background-color: rgba(255, 255, 255, 0.05);
            padding: 20px 22px;
            border-radius: 10px;
            border-left: 5px solid rgb(128, 64, 64);
        }
    </style>
</head>	
<body>
	
		<!--	背景動画(音声なし・自動再生・ループ)-->
	<video class="background-video"
				autoplay
				muted
				loop
				playsinline>
			<source src="/background.mp4" type="video/mp4">
			
			</video>
	

    <!-- ローディング画面 -->
    <div id="loadingOverlay">
        <div class="spinner"></div>
        <div>🤖 AIがカウンセリング分析中です。少々お待ちください...</div>
    </div>

    <div class="container">
        <h1>【メンタルカウンセリング】</h1>
        
        <!-- 投稿フォーム（onsubmitにeventを渡すように修正） -->
        <form action="/add-with-ai" method="POST" onsubmit="return showLoading(event)">
            <div>
                <label>■ 本文・内容詳細</label>
                <textarea name="content" placeholder="今日の業務内容や、学校、日々の生活の状況を詳しく入力してください..." required></textarea>
            </div>
            <div>
                <label>■ 自分ががんばったこと</label>
                <textarea name="effort" placeholder="自分が工夫したこと、しんどい中でやりきったことなどを記入..." required></textarea>
            </div>
            <button type="submit">登録 ＆ AIカウンセリングを実行</button>
        
        </form>
		
        <!-- 履歴一覧を表示するテーブル -->
        <table>
            <thead>	
                <tr>
                    <th>ID</th>
                    <th>本文</th>
                    <th>自分ががんばったこと</th>
                    <th>危険度 / 登録日時</th>
                    <th>AIカウンセリング結果</th>
                </tr>
            </thead>
            <tbody>
                <!-- データベースに記録が1件もないときの表示 -->
                <tr th:if="${logs.empty}">
                    <td colspan="5" style="text-align: center; padding: 40px; color: #777; font-size: 16px;">まだ登録がありません。上のフォームから記録を入力してみましょう！</td>
                </tr>
                
                <!-- 記録が存在するとき、Thymeleafでループさせて1件ずつ行として表示 -->
                <tr th:each="log : ${logs}">
                    <td th:text="${log.id}" style="text-align: center; font-weight: bold;">1</td>
                    
                    <!-- 本文表示   ◆◆◆　投稿文字サイズ-->
                    <td>
                        <div style="color: #222222; font-size: 20px; font-weight: 500; line-height: 1.8;"
						 th:text="${log.content}">本文</div>
                    </td>
					<!--　自分ががんばったこと欄　	◆◆◆　投稿文字サイズ-->
                    <td th:text="${log.effort}" style="color: #222222;	font-size: 20px; font-weight: 500; line-height: 1.8;">がんばったこと</td>
                    
                    <!-- 危険度＆レベル別カラー＆アイコン -->
                    <td style="text-align: center;">
                        <span class="danger-badge" 
                              th:classappend="${log.dangerLevel.contains('Lv.1') ? 'badge-level1' : 
                                               (log.dangerLevel.contains('Lv.2') ? 'badge-level2' : 
                                               (log.dangerLevel.contains('Lv.3') ? 'badge-level3' : 
                                               (log.dangerLevel.contains('Lv.4') ? 'badge-level4' : 
                                               (log.dangerLevel.contains('Lv.5') ? 'badge-level5' : 'badge-level1'))))}">
                            
                            <!-- 危険度に応じたアイコン画像 -->
							<img class="danger-icon"
							     th:src="${log.dangerLevel.contains('Lv.1') ? '/level1.png' :
							              (log.dangerLevel.contains('Lv.2') ? '/level2.png' :
							              (log.dangerLevel.contains('Lv.3') ? '/level3.png' :
							              (log.dangerLevel.contains('Lv.4') ? '/level4.png' :
							              (log.dangerLevel.contains('Lv.5') ? '/level5.png' : '/level1.png'))))}"
							     alt="危険度アイコン">
                            
                            <span th:text="${log.dangerLevel}">注意(Lv.1)</span>
                        </span>
								
                        <!-- 時間付きの日時表記 -->
                        <span class="created-time" th:text="${log.createdAt}">2026-10-20 14:30</span>	
                    </td>
                
                    <!-- AI⓷による分析結果 -->
                    <td>
                     <div class="ai-content"
					 th:text="${log.detailedReport !=null ? log.detailedReport : '最終回答はまだありません。'}">
					 AI⓷の最終回答</div>
                  </td>
               </tr>					
          </tbody>	
      </table>	
	     </div>
	
<!--	ローディング画面を表示する処理　-->
	<script>
	
			
		//   登録ボタンが押された時に実行される
		function  showLoading(event) {
			const content = document.querySelector('textarea[name="content"]').value.trim();
			const effort = document.querySelector('textarea[name="effort"]').value.trim();
			
			if (!content || !effort) {
				alert("がんばったことを入力してください。");
			return false;
			}
		
			//  AIが分析中であることを画面に表示する
			document.getElementById('loadingOverlay').style.display = "flex";
			
			//  tureを返すことで、通常フォーム送信を許可する
			// java側のLogControllerにデータが送信される
			
			return true;
			
		}
	
	</script>
	
</body>
</html>
