spring.application.name=mental-counseling

# サーバーのポート番号(公開環境ではPORTが使われる)
server.port=${PORT:8081}

# Gemini API キーの設定
gemini.api.key=${GEMINI_API_KEY:}
gemini.api.key2=${GEMINI_API_KEY_2:}
gemini.api.key3=${GEMINI_API_KEY_3:}

# Geminiモデル
gemini.api.model=gemini-3.6-flash

# Groq API キーの設定
groq.api.key=${GROQ_API_KEY:}
groq.api.model=openai/gpt-oss-20b

# Cloudflare Workers AI の設定
cloudflare.account.id=${CLOUDFLARE_ACCOUNT_ID:}
cloudflare.api.token=${CLOUDFLARE_API_TOKEN:}
cloudflare.ai.model=@cf/meta/llama-3.1-8b-instruct